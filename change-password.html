<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set New Password — St. Camillus Medical Center</title>
<link rel="icon" type="image/png" href="logo-seal.png">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="login.css">
</head>
<body class="login-body">

<div class="login-orb login-orb-1" aria-hidden="true"></div>
<div class="login-orb login-orb-2" aria-hidden="true"></div>
<div class="login-orb-dot login-orb-dot-1" aria-hidden="true"></div>
<div class="login-orb-dot login-orb-dot-2" aria-hidden="true"></div>

<div class="login-wrap">
  <div class="login-card">
    <div class="login-brand">
      <img src="logo-seal.png" alt="St. Camillus Medical Center seal">
      <div class="login-brand-text">
        <span class="login-brand-name">ST. CAMILLUS<br>MEDICAL CENTER</span>
        <span class="login-brand-tag">Reporting Dashboard</span>
      </div>
    </div>

    <h1>Set a new password</h1>
    <p class="login-sub">This is your first time signing in. Please choose a new password to continue.</p>

    <form id="changePasswordForm" novalidate>
      <label class="field">
        <span>New password</span>
        <div class="password-row">
          <input type="password" id="newPassword" autocomplete="new-password" placeholder="Enter new password" required minlength="6">
          <button type="button" class="pw-toggle" id="pwToggle1" aria-label="Show password">
            <svg viewBox="0 0 24 24" width="18" height="18"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </label>
      <label class="field">
        <span>Confirm new password</span>
        <div class="password-row">
          <input type="password" id="confirmPassword" autocomplete="new-password" placeholder="Re-enter new password" required minlength="6">
          <button type="button" class="pw-toggle" id="pwToggle2" aria-label="Show password">
            <svg viewBox="0 0 24 24" width="18" height="18"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </label>

      <div class="login-error" id="changeError" hidden></div>

      <button type="submit" class="primary-btn login-submit" id="changeSubmit">Set Password &amp; Continue</button>
    </form>

    <p class="login-foot"><a href="login.html" id="backToLogin">Back to sign in</a></p>
  </div>
</div>

<script type="module" src="change-password.js"></script>
</body>
</html>
