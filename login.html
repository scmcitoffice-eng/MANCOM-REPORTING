<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — St. Camillus Medical Center</title>
<link rel="icon" type="image/png" href="logo-seal.png">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="login.css">
</head>
<body class="login-body">

<div class="login-wrap">
  <div class="login-card">
    <div class="login-brand">
      <img src="logo-seal.png" alt="St. Camillus Medical Center seal">
      <div class="login-brand-text">
        <span class="login-brand-name">ST. CAMILLUS<br>MEDICAL CENTER</span>
        <span class="login-brand-tag">Reporting Dashboard</span>
      </div>
    </div>

    <h1>Sign in</h1>
    <p class="login-sub">Use your staff account to continue.</p>

    <form id="loginForm" novalidate>
      <label class="field">
        <span>Username</span>
        <input type="text" id="loginUsername" autocomplete="username" placeholder="Enter username" required>
      </label>
      <label class="field">
        <span>Password</span>
        <div class="password-row">
          <input type="password" id="loginPassword" autocomplete="current-password" placeholder="Enter password" required>
          <button type="button" class="pw-toggle" id="pwToggle" aria-label="Show password">
            <svg viewBox="0 0 24 24" width="18" height="18"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </label>

      <div class="login-error" id="loginError" hidden></div>

      <button type="submit" class="primary-btn login-submit" id="loginSubmit">Sign In</button>
    </form>

    <p class="login-foot">© 2026 St. Camillus Medical Center. IT Department.</p>
  </div>
</div>

<script src="login.js"></script>
</body>
</html>
